<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar System Model</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three-csgmesh@1.0.6/build/three-csgmesh.umd.js"></script>

</head>
<body>
    <canvas id="canvas"></canvas>

    <script src="markers/side-marker.js"></script>
    <script src="markers/location-markers.js"></script>

    <script src="planets/planet.js"></script>
    <script src="planets/sky.js"></script>
    <script src="planets/sun.js"></script>
    <script src="planets/mercury.js"></script>
    <script src="planets/venus.js"></script>
    <script src="planets/earth.js"></script>
    <script src="planets/mars.js"></script>
    <script src="planets/jupiter.js"></script>
    <script src="planets/saturn.js"></script>
    <script src="planets/uranus.js"></script>
    <script src="planets/neptune.js"></script>
    <script src="views/base-view.js"></script>
    <script src="views/global-view.js"></script>
    <script src="views/planet-side-view.js"></script>
    <script src="views/local-view.js"></script>
    <script src="control-panels/control-panel.js"></script>
    <script src="control-panels/control-panel-solar-system.js"></script>
    <script src="control-panels/control-panel-view.js"></script>
    <script src="control-panels/control-panel-planet.js"></script>
    <script src="solar-system.js"></script>
    <script>
        // Initialize the solar system when the page loads
        window.addEventListener('load', function() {
            console.log('Page loaded, initializing solar system...');

            // Add global error handler for texture loading issues
            THREE.TextureLoader.prototype.crossOrigin = '';

            try {
                const solarSystem = new SolarSystem();
                console.log('Solar system initialized successfully');
            } catch (error) {
                console.error('Failed to initialize solar system:', error);
            }
        });

        // Add global error handler
        window.addEventListener('error', function(event) {
            console.error('Global error caught:', event.error);
        });
    </script>
</body>
</html>
